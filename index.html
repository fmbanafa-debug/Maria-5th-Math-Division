<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 5 Math Quiz Assistant & Practice Tool</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
        }
        .heading-font {
            font-family: 'Fredoka', cursive;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.7);
        }
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-ring 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse-ring {
            to {
                box-shadow: 0 0 0 16px rgba(239, 68, 68, 0);
            }
        }
        /* Custom styled fraction rendering */
        .frac {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            padding: 0 4px;
            font-weight: 700;
        }
        .frac .top {
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 1px;
        }
        .frac .bottom {
            padding-top: 1px;
        }
    </style>
</head>
<body class="text-slate-800 pb-12 flex flex-col items-center">

    <!-- Top Header -->
    <header class="w-full max-w-5xl mx-auto px-4 py-4 mb-2">
        <div class="glass-card rounded-3xl p-5 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4 border-b-4 border-blue-400">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-tr from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">
                    <i class="fa-solid fa-calculator"></i>
                </div>
                <div>
                    <h1 class="heading-font text-2xl md:text-3xl text-blue-900 font-bold">Imperial Int. School Math Assistant</h1>
                    <p class="text-sm font-semibold text-slate-500">Grade 5 • Interactive Quiz 1 Practice</p>
                </div>
            </div>
            
            <!-- Voice Status & Controls -->
            <div class="flex items-center gap-3 bg-blue-50/80 p-2.5 rounded-2xl border border-blue-200">
                <button id="speech-toggle-btn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl shadow transition transform active:scale-95 text-sm">
                    <i id="mic-icon" class="fa-solid fa-microphone"></i>
                    <span id="mic-label">Activate Safari Voice Recognition</span>
                </button>
                <button id="read-question-btn" class="bg-amber-500 hover:bg-amber-600 text-white p-2.5 rounded-xl shadow transition transform active:scale-95 text-sm flex items-center justify-center w-10 h-10" title="Read Question Aloud">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-5xl px-4 flex flex-col gap-6">

        <!-- Safari Speech Status Banner -->
        <div id="speech-status-banner" class="hidden glass-card rounded-2xl p-3 border-l-4 border-emerald-500 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span id="speech-status-text" class="text-sm font-bold text-emerald-800">Voice Recognition Listening... Say "Option A", "B", "C", "D" or state numerical answer!</span>
            </div>
            <span id="transcript-display" class="bg-white/80 px-3 py-1 rounded-lg text-xs font-mono border border-slate-200 text-slate-600 max-w-xs truncate"></span>
        </div>

        <!-- Progress Bar & Question Nav -->
        <div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="w-full md:w-2/3">
                <div class="flex justify-between items-center mb-1 text-sm font-bold text-slate-600">
                    <span id="question-tracker">Question 1 of 30</span>
                    <span id="score-tracker" class="text-emerald-600">Score: 0 / 0</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full rounded-full transition-all duration-300" style="width: 3%"></div>
                </div>
            </div>

            <!-- Jump Selector -->
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <label class="text-xs font-bold text-slate-500">Jump to:</label>
                <select id="question-select" class="bg-white border border-slate-300 font-bold text-slate-700 text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Populated dynamically -->
                </select>
            </div>
        </div>

        <!-- Question Card -->
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-xl border-t-4 border-indigo-500 flex flex-col gap-6 relative overflow-hidden">
            
            <!-- Category Tag -->
            <div class="flex items-center justify-between">
                <span id="question-category" class="bg-indigo-100 text-indigo-800 font-bold text-xs uppercase tracking-wider px-3 py-1 rounded-full border border-indigo-200">
                    Fractions & Decimals
                </span>
                <span id="question-number-badge" class="heading-font text-2xl font-bold text-slate-300">
                    #1
                </span>
            </div>

            <!-- Question Prompt Box -->
            <div id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 leading-relaxed min-h-[70px] flex items-center">
                <!-- Question content rendered dynamically -->
            </div>

            <!-- Graphic / Extra Context Container (for Ratio Tables & Graphs) -->
            <div id="visual-container" class="hidden bg-slate-50 rounded-2xl p-4 border border-slate-200 flex justify-center items-center">
                <!-- Rendered SVG Graph or HTML Tables -->
            </div>

            <!-- Input / Options Area -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                <!-- Multiple Choice buttons or Free Answer input injected here -->
            </div>

            <!-- Feedback Alert -->
            <div id="feedback-alert" class="hidden rounded-2xl p-4 text-center font-bold text-lg animate-bounce transition-all"></div>

            <!-- Hint / Explanation Box -->
            <div id="explanation-box" class="hidden bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 text-amber-900 text-sm leading-relaxed">
                <div class="flex items-center gap-2 font-bold mb-1 text-amber-800">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i> Step-by-Step Solution:
                </div>
                <div id="explanation-text" class="font-medium"></div>
            </div>

            <!-- Footer Action Controls -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-200/80">
                <button id="prev-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2.5 rounded-xl transition flex items-center gap-2 disabled:opacity-40">
                    <i class="fa-solid fa-arrow-left"></i> Previous
                </button>
                <button id="hint-toggle-btn" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-4 py-2.5 rounded-xl transition text-sm flex items-center gap-1.5">
                    <i class="fa-regular fa-lightbulb"></i> Show Hint
                </button>
                <button id="next-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition flex items-center gap-2 active:scale-95">
                    Next <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
        
    </main>

        function renderQuestion(idx) {
            currentQuestionIdx = idx;
            const q = quizData[idx];

            // Reset views
            feedbackAlertEl.classList.add('hidden');
            explanationBoxEl.classList.add('hidden');
            visualContainerEl.classList.add('hidden');
            visualContainerEl.innerHTML = '';

            // Set text & labels
            questionCategoryEl.innerText = q.category;
            questionBadgeEl.innerText = `#${q.id}`;
            questionTextEl.innerHTML = q.question;
            questionTrackerEl.innerText = `Question ${idx + 1} of ${quizData.length}`;
            questionSelectEl.value = idx;

            // Update progress bar
            const pct = ((idx + 1) / quizData.length) * 100;
            progressBarEl.style.width = `${pct}%`;

            // Nav buttons state
            prevBtn.disabled = idx === 0;
            nextBtn.innerText = idx === quizData.length - 1 ? "Finish" : "Next";

            // Render Options / Inputs
            optionsContainerEl.innerHTML = '';

            if (q.type === 'mcq' || q.type === 'table' || q.type === 'graph') {
                q.options.forEach((opt, oIdx) => {
                    const btn = document.createElement('button');
                    btn.className = `w-full text-left p-4 rounded-2xl font-bold border-2 transition-all flex items-center justify-between ${
                        userAnswers[idx] === oIdx 
                            ? (oIdx === q.answer ? 'bg-emerald-50 border-emerald-500 text-emerald-900' : 'bg-rose-50 border-rose-500 text-rose-900')
                            : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-700 shadow-sm hover:shadow'
                    }`;
                    btn.innerHTML = `<span>${opt}</span> <i class="fa-regular ${userAnswers[idx] === oIdx ? (oIdx === q.answer ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600') : 'fa-circle text-slate-300'}"></i>`;
                    btn.onclick = () => selectOption(oIdx);
                    optionsContainerEl.appendChild(btn);
                });
            } else if (q.type === 'text') {
                const wrapper = document.createElement('div');
                wrapper.className = "col-span-full flex flex-col gap-3";
                
                const input = document.createElement('input');
                input.type = "text";
                input.id = "free-text-input";
                input.placeholder = "Type your answer or speak it (e.g., 9/4)...";
                input.className = "w-full p-4 rounded-2xl border-2 border-slate-300 font-bold text-lg focus:border-indigo-500 focus:outline-none";
                if (userAnswers[idx] !== null) input.value = userAnswers[idx];

                const submitBtn = document.createElement('button');
                submitBtn.className = "bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3.5 rounded-2xl shadow transition active:scale-95";
                submitBtn.innerText = "Check Answer";
                submitBtn.onclick = () => checkTextAnswer(input.value);

                wrapper.appendChild(input);
                wrapper.appendChild(submitBtn);
                optionsContainerEl.appendChild(wrapper);
            }

            // Update explanation text
            explanationTextEl.innerHTML = q.hint;

            // Optional auto speech readout
            speakText(stripHtml(q.question));
        }

        // Option selection handler for MCQ
        function selectOption(optionIdx) {
            const q = quizData[currentQuestionIdx];
            userAnswers[currentQuestionIdx] = optionIdx;

            const isCorrect = optionIdx === q.answer;
            showFeedback(isCorrect, isCorrect ? "Great job! That's correct!" : "Not quite! Check the hint below.");
            explanationBoxEl.classList.remove('hidden');

            updateScore();
            renderQuestion(currentQuestionIdx); // Refresh states
        }

        // Check text entry
        function checkTextAnswer(val) {
            const q = quizData[currentQuestionIdx];
            const cleanVal = val.trim().toLowerCase();
            userAnswers[currentQuestionIdx] = val;

            const isCorrect = q.acceptableAnswers.includes(cleanVal);
            showFeedback(isCorrect, isCorrect ? "Correct answer!" : `Try again! Accepted format: ${q.acceptableAnswers.join(' or ')}`);
            explanationBoxEl.classList.remove('hidden');

            updateScore();
        }

        // Show feedback message
        function showFeedback(isCorrect, message) {
            feedbackAlertEl.innerText = message;
            feedbackAlertEl.className = `rounded-2xl p-4 text-center font-bold text-lg animate-bounce ${
                isCorrect ? 'bg-emerald-100 text-emerald-800 border-2 border-emerald-300' : 'bg-rose-100 text-rose-800 border-2 border-rose-300'
            }`;
            feedbackAlertEl.classList.remove('hidden');
        }

        // Score Calculation
        function updateScore() {
            let correctCount = 0;
            let answeredCount = 0;

            quizData.forEach((q, idx) => {
                if (userAnswers[idx] !== null) {
                    answeredCount++;
                    if (q.type === 'mcq' || q.type === 'table' || q.type === 'graph') {
                        if (userAnswers[idx] === q.answer) correctCount++;
                    } else if (q.type === 'text') {
                        if (q.acceptableAnswers.includes(String(userAnswers[idx]).trim().toLowerCase())) correctCount++;
                    }
                }
            });

            scoreTrackerEl.innerText = `Score: ${correctCount} / ${answeredCount}`;
        }

        // Setup Safari Web Speech Recognition
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                micLabel.innerText = "Speech Not Supported in Browser";
                speechToggleBtn.disabled = true;
                speechToggleBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micIcon.className = "fa-solid fa-microphone-slash text-rose-300";
                micLabel.innerText = "Stop Voice Assistant";
                speechToggleBtn.className = "flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2.5 rounded-xl shadow transition transform active:scale-95 text-sm pulse-ring";
                speechStatusBanner.classList.remove('hidden');
            };

            recognition.onend = () => {
                isListening = false;
                micIcon.className = "fa-solid fa-microphone";
                micLabel.innerText = "Activate Safari Voice Recognition";
                speechToggleBtn.className = "flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl shadow transition transform active:scale-95 text-sm";
                speechStatusBanner.classList.add('hidden');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                transcript = transcript.trim().toLowerCase();
                transcriptDisplay.innerText = `Heard: "${transcript}"`;

                processVoiceCommand(transcript);
            };

            recognition.onerror = (err) => {
                console.warn("Speech recognition error:", err);
            };
        }

        // Match speech inputs to answers or controls
        function processVoiceCommand(cmd) {
            const q = quizData[currentQuestionIdx];

            // Direct Option Voice Matches
            if (cmd.includes("option a") || cmd.includes("choice a") || cmd.endsWith(" a")) selectOption(0);
            else if (cmd.includes("option b") || cmd.includes("choice b") || cmd.endsWith(" b")) selectOption(1);
            else if (cmd.includes("option c") || cmd.includes("choice c") || cmd.endsWith(" c")) selectOption(2);
            else if (cmd.includes("option d") || cmd.includes("choice d") || cmd.endsWith(" d")) selectOption(3);
            else if (cmd.includes("next")) navigateNext();
            else if (cmd.includes("previous") || cmd.includes("back")) navigatePrev();

            // Match text answers
            if (q.type === 'text') {
                q.acceptableAnswers.forEach(acc => {
                    if (cmd.includes(acc)) {
                        const inputEl = document.getElementById('free-text-input');
                        if (inputEl) inputEl.value = acc;
                        checkTextAnswer(acc);
                    }
                });
            }
        }

        // Text To Speech helper for reading questions
        function speakText(text) {
            if (!synth) return;
            synth.cancel(); // Stop ongoing speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            synth.speak(utterance);
        }

        // Utility to clean HTML for Speech
        function stripHtml(html) {
            const tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        // Event Navigation Handlers
        function navigateNext() {
            if (currentQuestionIdx < quizData.length - 1) renderQuestion(currentQuestionIdx + 1);
        }

        function navigatePrev() {
            if (currentQuestionIdx > 0) renderQuestion(currentQuestionIdx - 1);
        }

        function setupEventListeners() {
            prevBtn.onclick = navigatePrev;
            nextBtn.onclick = navigateNext;

            hintToggleBtn.onclick = () => {
                explanationBoxEl.classList.toggle('hidden');
            };

            questionSelectEl.onchange = (e) => {
                renderQuestion(parseInt(e.target.value));
            };

            speechToggleBtn.onclick = () => {
                if (!recognition) return;
                if (isListening) recognition.stop();
                else recognition.start();
            };

            readQuestionBtn.onclick = () => {
                const q = quizData[currentQuestionIdx];
                speakText(stripHtml(q.question));
            };
        }

        // Run application on load
        window.onload = initApp;
    </script>
</body>
</html>
